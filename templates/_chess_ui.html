<style>

  .chess-page {

  }

    margin: 16px 0;
  }

  .chess-actions {
    display: flex;
    align-items: end;
    flex-wrap: wrap;
    gap: 10px;
  }

  .chess-row label,
  .chess-side label {
    display: grid;
    gap: 6px;
  }

  .chess-row input,
  .chess-row select,
  .chess-promote {
    border: 1px solid #52627b;
    border-radius: 9px;
    padding: 10px;
    background: #0d1727;
    color: #fff;
  }

  .chess-btn {
    border: 0;
    border-radius: 9px;
    padding: 10px 14px;

    color: #15202b;
    font-weight: 700;
    cursor: pointer;
  }

  .chess-btn.secondary {
    background: #33445f;
    color: #edf2fa;
  }

  .chess-error,
  .chess-msg {
    min-height: 26px;
    color: #ffd6a0;
  }

  .chess-list {
    display: grid;
    gap: 12px;
  }

  .chess-table {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border-radius: 12px;
    padding: 15px;
    background: #101b2c;
  }

  .chess-table p,
  .chess-rules {
    color: #b7c4d8;
  }

  .chess-layout {
    display: grid;
    grid-template-columns: minmax(0, 650px) minmax(260px, 1fr);
    align-items: start;
    gap: 20px;
  }

  .chess-side {
    min-width: 0;
    overflow-wrap: anywhere;
  }

  .chess-side input {
    width: 100%;
    min-width: 0;
  }

  /* The frame owns the size. Sidebar text and pieces cannot size the rows. */
  .chess-board-frame {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr) 22px;
    grid-template-rows: 22px minmax(0, 1fr) 22px;
    width: 100%;
    aspect-ratio: 1;
    align-self: start;
    border-radius: 10px;
    background: #263349;
    box-shadow: 0 16px 40px #0006;
  }

  .chess-board-frame[hidden] {
    display: none;
  }

    display: grid;
    place-items: center;
    color: #edf2fa;
    font-size: 12px;
    font-weight: 700;
    line-height: 1;
    user-select: none;
  }

  .chess-files {
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-column: 2;
  }

  .chess-files.top {
    grid-row: 1;
  }

  .chess-files.bottom {
    grid-row: 3;
  }

  .chess-ranks {
    grid-template-rows: repeat(8, minmax(0, 1fr));
    grid-row: 2;
  }

  .chess-ranks.left {
    grid-column: 1;
  }

  .chess-ranks.right {
    grid-column: 3;
  }

  .chess-board {
    grid-column: 2;
    grid-row: 2;
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    container-type: inline-size;
  }

  .chess-square {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 0;
    min-height: 0;
    border: 0;
    border-radius: 0;
    padding: 0;
    font-size: clamp(18px, 6vw, 64px);
    font-size: clamp(18px, 10cqi, 64px);
    line-height: 1;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .chess-square.light {
    background: #e6d7b7;
  }

  .chess-square.dark {
    background: #64816f;
  }

  .chess-piece {

    color: #fff9e9;

  }

  .chess-piece.black-piece {
    color: #101b2c;
    -webkit-text-stroke: .5px #edf2fa;
  }

  .chess-square.selected {
    box-shadow: inset 0 0 0 4px #553400, inset 0 0 0 7px #ffda70;
  }

  /* A dark centre and bright border stay distinct on both square colours. */
  .chess-square.target::after {
    content: "";
    position: absolute;
    width: 25%;
    height: 25%;
    border: 2px solid #a6fcff;
    border-radius: 50%;
    background: #073e50;
    box-shadow: 0 0 0 2px #102b38;
    pointer-events: none;
  }

  .chess-square.target-capture::after {
    inset: 5%;
    width: auto;
    height: auto;
    border: 4px solid #073e50;
    background: transparent;
    box-shadow: inset 0 0 0 2px #a6fcff, 0 0 0 2px #a6fcff;
  }

  .chess-square:focus-visible {
    z-index: 2;
    outline: 3px solid #fff;
    outline-offset: -3px;
  }

  .chess-board-help {
    margin: 12px 0 0;
    color: #b7c4d8;
    font-size: 13px;
  }

  .chess-players {
    line-height: 1.8;
  }

  .chess-turn {
    margin: 12px 0;
    font-size: 1.15rem;
    font-weight: 700;
  }

  @media (max-width: 760px) {
    .chess-layout {
      grid-template-columns: 1fr;
    }

    .chess-page,
    .chess-wrap {
      margin: 12px auto;
      padding: 10px;
    }

  }

  @media (max-width: 650px) {
    .chess-table {
      align-items: flex-start;
      flex-direction: column;
    }
  }
</style>
