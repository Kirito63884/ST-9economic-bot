{% if may_view_statistics(user) %}
<style>
  #statisticsFreshness {
    margin: 16px auto;
    padding: 16px 20px;
    max-width: 1180px;
    border: 1px solid #526c95;
    border-radius: 12px;
    background: #172338;
    color: #edf3ff;
  }
  #statisticsFreshness summary {
    cursor: pointer;
    font-weight: 700;
    font-size: 16px;
  }
  #statisticsFreshness p {
    margin: 12px 0;
    color: #bdcbe0;
    line-height: 1.6;
  }
  #statisticsFreshness li {
    padding: 6px 0;
    overflow-wrap: anywhere;
  }
  .source-progress {
    padding: 16px;
    border: 1px solid #526c95;
    border-radius: 10px;
    margin-top: 14px;
  }
  .source-progress progress {
    width: 100%;
    height: 18px;
    accent-color: #7faeff;
  }
  .source-progress small {
    display: block;
    color: #bdcbe0;
    margin-top: 7px;
  }
</style>
<details id="statisticsFreshness" {% if statistics_expanded|default(false) %}open{% endif %}>
  <summary>
    Свежесть статистики <span data-freshness-summary>— проверяем…</span>
  </summary>
  <p>
    Дата успешного получения данных и ход текущей загрузки показываются
    отдельно. Новая попытка не меняет дату последнего успеха.
  </p>
  <div class="source-progress" data-collection hidden aria-live="polite">
    <strong data-collection-title>SQSTAT</strong>
    <progress
      data-collection-bar
      max="100"
      value="0"
      aria-label="Обработано профилей"
    ></progress>
    <p data-collection-detail></p>
    <small data-collection-time></small>
    <small data-collection-error></small>
  </div>
  <ul data-freshness-list aria-live="polite"></ul>
</details>
<script>
  (() => {
    const root = document.getElementById("statisticsFreshness");
    if (!root) return;
    const summary = root.querySelector("[data-freshness-summary]");
    const list = root.querySelector("[data-freshness-list]");
    const states = {
      fresh: "актуально",
      stale: "устарело",
      missing: "ещё не получено",
    };
    const statuses = {
      ready: "доступен",
      collecting: "собирает данные",
      offline: "сервер выключен",
      pending: "ожидает проверки",
      starting: "запускается",
      partial: "получена часть данных",
      unavailable: "недоступен",
      auth_required: "нужен вход",
      error: "ошибка обновления",
      warming: "собирает историю",
    };
    const phases = {
      profiles: "Профили игроков",
      archive: "Архив матчей",
      idle: "Ожидание следующего цикла",
    };
    const dates = new Intl.DateTimeFormat("ru-RU", {
      timeZone: "Europe/Moscow",
      dateStyle: "short",
      timeStyle: "medium",
    });
    const stamp = (value) =>
      value && Number.isFinite(new Date(value).getTime())
        ? dates.format(new Date(value)) + " МСК"
        : "ещё нет";
    function showProgress(p) {
      root.querySelector("[data-collection]").hidden = false;
      root.querySelector("[data-collection-title]").textContent =
        `SQSTAT · ${statuses[p.status] || "ожидает проверки"} · ${phases[p.phase] || "подготовка"}`;
      const bar = root.querySelector("[data-collection-bar]");
      bar.hidden = p.phase !== "profiles" || !p.profiles_total;
      bar.value = p.profile_percent || 0;
      const lines = [
        `Профили: обработано ${p.profiles_done} из ${p.profiles_total}; ошибок ${p.profiles_failed}.`,
      ];
      if (p.phase === "profiles" && p.current_profile_index)
        lines.push(`Сейчас запрашивается профиль №${p.current_profile_index}.`);
      if (p.phase === "archive")
        lines.push(
          `Проверяется архив${p.current_match ? ": матч №" + p.current_match : ""}; непрочитанных матчей: ${p.archive_failed}. Процент архива пока неизвестен.`,
        );
      if (p.status === "collecting" && p.pause_seconds)
        lines.push(
          `До следующего разрешённого запроса: ${p.pause_seconds} сек.`,
        );
      if (p.status === "collecting" && p.state_age_seconds > 600)
        lines.push(
          "Состояние давно не менялось: возможны пауза источника или задержка сборщика.",
        );
      root.querySelector("[data-collection-detail]").textContent =
        lines.join(" ");
      root.querySelector("[data-collection-time]").textContent =
        `Начало цикла: ${stamp(p.cycle_started_at)}. Состояние обновлено: ${stamp(p.state_updated_at)}. Последний успех: ${stamp(p.checked_at)}.`;
      root.querySelector("[data-collection-error]").textContent = p.last_error
        ? "Последняя ошибка: " + p.last_error
        : "";
    }
    let busy = false;
    async function refresh() {
      if (busy) return;
      busy = true;
      try {
        const response = await fetch("/api/statistics/freshness", {
          cache: "no-store",
          signal: AbortSignal.timeout(10000),
        });
        if (!response.ok) throw new Error("unavailable");
        const data = await response.json(),
          fragment = document.createDocumentFragment();
        let attention = 0;
        for (const source of data.sources) {
          if (
            source.state !== "fresh" ||
            !["ready", "offline"].includes(source.status)
          )
            attention++;
          const item = document.createElement("li");
          item.textContent = `${source.name}: ${states[source.state]} · ${stamp(source.checked_at)}${source.status !== "ready" ? " · " + (statuses[source.status] || "требует проверки") : ""}`;
          fragment.append(item);
          if (source.progress) showProgress(source.progress);
        }
        list.replaceChildren(fragment);
        summary.textContent = attention
          ? `— требуют внимания: ${attention}`
          : "— актуально";
      } catch {
        summary.textContent =
          "— проверка недоступна; показанные данные могли устареть";
      } finally {
        busy = false;
      }
    }
    refresh();
    setInterval(() => {
      if (!document.hidden && root.open) refresh();
    }, 15000);
  })();
</script>
{% endif %}
