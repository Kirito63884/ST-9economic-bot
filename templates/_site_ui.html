<script nonce="{{ nonce|default('') }}">
(() => {
    const ui = (window.STUI = {});
    ui.escape = (value) =>
        String(value ?? "").replace(
            /[&<>"']/g,
            (ch) =>
                ({
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;",
                })[ch],
        );
    ui.notice = (message, type = "info") => {
        let container = document.getElementById("stNotices");
        if (!container) {
            container = document.createElement("div");
            container.id = "stNotices";
            container.className = "st-notices";
            container.setAttribute("role", "status");
            container.setAttribute("aria-live", "polite");
            document.body.appendChild(container);
        }
        const item = document.createElement("div");
        item.className = "st-notice " + type;
        item.textContent = message;
        container.appendChild(item);
        setTimeout(() => item.remove(), 5500);
    };
    ui.setBalance = (value) => {
        if (!Number.isFinite(Number(value))) return;
        document
            .querySelectorAll("[data-st-balance]")
            .forEach((node) => (node.textContent = Number(value).toFixed(2)));
    };
    ui.activateTab = (group, name, focus = false) => {
        const root = document.querySelector(`[data-st-tab-group="${group}"]`);
        if (!root) return;
        const target = [...root.querySelectorAll("[data-st-tab]")].find(
            (button) => button.dataset.stTab === name,
        );
        if (!target) return;
        root.querySelectorAll("[data-st-tab]").forEach((button) => {
            const active = button === target;
            button.setAttribute("aria-selected", String(active));
            button.tabIndex = active ? 0 : -1;
        });
        root.querySelectorAll("[data-st-panel]").forEach(
            (panel) => (panel.hidden = panel.dataset.stPanel !== name),
        );
        if (group === "profile")
            window.history.replaceState(
                null,
                "",
                location.pathname + (name === "overview" ? "" : "#" + name),
            );
        if (focus) target.focus();
    };
    document.addEventListener("DOMContentLoaded", () => {
        const content =
            document.getElementById("st-content") ||
            document.querySelector("main") ||
            document.querySelector(".container") ||
            document.querySelector(".container-fluid") ||
            document.querySelector(".game-container");
        if (content && !document.getElementById("st-content")) {
            content.id = "st-content";
            content.tabIndex = -1;
        }
        document.querySelectorAll("[data-st-tab-group]").forEach((root) => {
            const group = root.dataset.stTabGroup;
            root.querySelectorAll("[data-st-tab]").forEach((button) =>
                button.addEventListener("click", () => ui.activateTab(group, button.dataset.stTab)),
            );
            root.querySelector("[role=tablist]")?.addEventListener("keydown", (event) => {
                const tabs = [...root.querySelectorAll("[data-st-tab]")],
                    index = tabs.indexOf(document.activeElement);
                if (index < 0 || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key))
                    return;
                event.preventDefault();
                const next =
                    event.key === "Home"
                        ? 0
                        : event.key === "End"
                          ? tabs.length - 1
                          : (index + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) %
                            tabs.length;
                ui.activateTab(group, tabs[next].dataset.stTab, true);
            });
            ui.activateTab(
                group,
                group === "profile" && ["edit", "history"].includes(location.hash.slice(1))
                    ? location.hash.slice(1)
                    : root.querySelector("[aria-selected=true]")?.dataset.stTab ||
                          root.querySelector("[data-st-tab]").dataset.stTab,
            );
        });
        document.querySelectorAll("[data-st-copy]").forEach((button) =>
            button.addEventListener("click", async () => {
                try {
                    await navigator.clipboard.writeText(button.dataset.stCopy);
                    ui.notice("ID скопирован", "success");
                } catch {
                    ui.notice("Не удалось скопировать. Выделите ID вручную.", "error");
                }
            }),
        );
        document.querySelectorAll("[data-st-bet-value]").forEach((button) =>
            button.addEventListener("click", () => {
                const input = document.getElementById(
                    button.closest("[data-st-bet-target]").dataset.stBetTarget,
                );
                if (!input || input.disabled || input.closest("[aria-busy=true]")) return;
                const current = Number(input.value) || 0,
                    preset = button.dataset.stBetValue;
                const wallet =
                    Number(document.querySelector("[data-st-balance]")?.textContent) || 0;
                const value =
                    preset === "half"
                        ? current / 2
                        : preset === "double"
                          ? current * 2
                          : preset === "max"
                            ? wallet
                            : Number(preset);
                input.value = Math.max(
                    Number(input.min) || 0.01,
                    Math.round(value * 100) / 100,
                ).toFixed(2);
                input.dispatchEvent(
                    new Event("input", {
                        bubbles: true,
                    }),
                );
            }),
        );
        const network = document.createElement("div");
        network.className = "st-network";
        network.hidden = true;
        network.setAttribute("role", "status");
        network.textContent =
            "Нет соединения. Дождитесь восстановления связи перед отправкой действий.";
        document.querySelector(".st-header")?.appendChild(network);
        const updateNetwork = () => (network.hidden = navigator.onLine);
        window.addEventListener("offline", updateNetwork);
        window.addEventListener("online", updateNetwork);
        updateNetwork();
        document.addEventListener("click", (event) =>
            document.querySelectorAll(".st-user-menu[open]").forEach((menu) => {
                if (!menu.contains(event.target)) menu.open = false;
            }),
        );
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape")
                document
                    .querySelectorAll(".st-user-menu[open]")
                    .forEach((menu) => (menu.open = false));
        });
    });
})();

</script>
