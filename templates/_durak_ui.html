<script nonce="{{ request.state.csp_nonce }}">
window.DK = (() => {
    const esc = STUI.escape;
    const money = (value) =>
        (Number(value) / 100).toLocaleString("ru-RU", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
        }) + " БК";
    const defaults = {
        deck_size: 36,
        hand_size: 6,
        max_players: 6,
        variant: "throw",
        throwers: "all",
        attack_limit: 6,
        unlimited_attack: false,
        cheating: false,
        first_five: false,
        exchange_trump: false,
        throw_after_take: true,
        turn_seconds: 60,
        private: false,
        entry_cents: 1000,
    };
    async function api(url, data) {
        const response = await fetch(url, {
            credentials: "same-origin",
            headers:
                data === undefined
                    ? {}
                    : {
                          "Content-Type": "application/json",
                      },
            method: data === undefined ? "GET" : "POST",
            body: data === undefined ? undefined : JSON.stringify(data),
        });
        let payload;
        try {
            payload = await response.json();
        } catch {
            throw Error("Сервер временно недоступен. Повторите попытку");
        }
        if (!response.ok) {
            const error = Error(
                typeof payload.detail === "string"
                    ? payload.detail
                    : "Не удалось выполнить действие",
            );
            error.status = response.status;
            throw error;
        }
        return payload;
    }

    function form(el, rules = defaults) {
        const r = {
                ...defaults,
                ...rules,
            },
            prefix = el.id;
        const select = (key, label, options) =>
            `<div><label for="${prefix}-${key}">${label}</label><select class="form-select" name="${key}" id="${prefix}-${key}">${options.map(([value, name]) => `<option value="${value}" ${String(r[key]) === String(value) ? "selected" : ""}>${name}</option>`).join("")}</select></div>`;
        el.innerHTML = `<div class="dk-form">${select("variant", "Вариант", [
            ["throw", "Подкидной"],
            ["transfer", "Переводной"],
        ])}${select("throwers", "Кто подкидывает", [
            ["all", "Все, кроме защитника"],
            ["neighbors", "Соседи защитника"],
        ])}${select(
            "deck_size",
            "Карт в колоде",
            [24, 36, 52].map((x) => [x, x]),
        )}${select(
            "hand_size",
            "Карт на руках",
            [4, 5, 6, 7, 8].map((x) => [x, x]),
        )}${select(
            "max_players",
            "Мест за столом",
            [2, 3, 4, 5, 6].map((x) => [x, x]),
        )}${select(
            "attack_limit",
            "Карт в нападении, максимум",
            [1, 2, 3, 4, 5, 6, 7, 8].map((x) => [x, x]),
        )}${select(
            "turn_seconds",
            "Время хода",
            [30, 60, 90, 120].map((x) => [x, x + " секунд"]),
        )}<div><label for="${prefix}-entry">Взнос каждого, БК</label><input class="form-control" id="${prefix}-entry" name="entry" inputmode="decimal" value="${(r.entry_cents / 100).toFixed(2)}" required><small class="st-field-hint">0 — игра без ставок</small></div>${[
            ["unlimited_attack", "Подкидывать без лимита по числу карт"],
            ["cheating", "Шулерство: подкидывать и отбивать любой картой"],
            ["first_five", "В первом нападении максимум 5 карт"],
            ["exchange_trump", "Обмен младшего козыря"],
            ["throw_after_take", "Подкидывать после «Беру»"],
            ["private", "Закрытый стол по ссылке"],
        ]
            .map(
                ([k, l]) =>
                    `<label class="dk-check dk-full"><input type="checkbox" name="${k}" ${r[k] ? "checked" : ""}>${l}</label>`,
            )
            .join(
                "",
            )}<div class="dk-full st-field-hint">Без лимита можно подкинуть больше карт, чем у защитника. Ограничения числа карт и первого нападения тогда не действуют. При шулерстве можно подкидывать и отбивать любой картой. Другие участники могут проверить последнюю карту до следующей выкладки или конца нападения: нарушитель забирает её и повторяет ход. Перевод — по обычным правилам. «Крайние» — два его соседа среди оставшихся игроков.</div></div>`;
        const limit = () => {
            const max = Math.min(
                6,
                Math.floor(
                    Number(el.elements.deck_size.value) / Number(el.elements.hand_size.value),
                ),
            );
            for (const o of el.elements.max_players.options) o.disabled = Number(o.value) > max;
            if (Number(el.elements.max_players.value) > max)
                el.elements.max_players.value = String(max);
        };
        el.elements.deck_size.addEventListener("change", limit);
        el.elements.hand_size.addEventListener("change", limit);
        limit();
        const toggleLimit = () => {
            el.elements.attack_limit.disabled = el.elements.unlimited_attack.checked;
            el.elements.first_five.disabled = el.elements.unlimited_attack.checked;
        };
        el.elements.unlimited_attack.addEventListener("change", toggleLimit);
        toggleLimit();
    }

    function read(el) {
        const r = {};
        for (const [k, v] of Object.entries(defaults)) {
            if (k === "entry_cents") {
                const raw = el.elements.entry.value.trim().replace(",", ".");
                if (!/^\d{1,7}(\.\d{1,2})?$/.test(raw))
                    throw Error("Укажите взнос от 0 до 1 000 000 БК, до двух знаков после запятой");
                const [whole, fraction = ""] = raw.split(".");
                r[k] = Number(whole) * 100 + Number(fraction.padEnd(2, "0"));
                if (r[k] > 100000000) throw Error("Максимальный взнос — 1 000 000 БК");
            } else
                r[k] =
                    typeof v === "boolean"
                        ? el.elements[k].checked
                        : typeof v === "number"
                          ? Number(el.elements[k].value)
                          : el.elements[k].value;
        }
        return r;
    }

    function summary(r) {
        return `${r.variant === "transfer" ? "Переводной" : "Подкидной"} · ${r.deck_size} карт · по ${r.hand_size} на руках · до ${r.max_players} игроков<br>Подкидывают: ${r.throwers === "all" ? "все" : "соседи защитника"} · ${r.unlimited_attack ? "без лимита по числу карт" : "максимум " + r.attack_limit + " карт"} · ход ${r.turn_seconds} с<br><strong>Шулерство: ${r.cheating ? "включено · подкидывание и защита любой картой" : "выключено"}</strong><br>${r.first_five && !r.unlimited_attack ? "Первое нападение: до 5 карт · " : ""}Обмен козыря: ${r.exchange_trump ? "да" : "нет"}<br>После «Беру» подкидывают: ${r.throw_after_take ? "да" : "нет"} · ${r.private ? "закрытый" : "открытый"} стол`;
    }

    function payouts(n, entry) {
        if (n < 2) return "Для партии нужны хотя бы два игрока.";
        const count = n - 1,
            total = (count * (count + 1)) / 2;
        return (
            `<strong>${n} игроков · банк ${money(n * entry)} · без комиссии</strong><br>` +
            Array.from(
                {
                    length: count,
                },
                (_, i) =>
                    `${i + 1}-й выход: ${(((count - i) / total) * 100).toLocaleString("ru-RU", { maximumFractionDigits: 2 })}%`,
            ).join(" · ") +
            `<br>Вышедшие одновременно делят доли своих мест поровну. При общей ничьей — возврат взносов. Выплата — доля банка, а не прибыль сверх взноса.`
        );
    }

    function playingCard(c, button = false, attributes = "") {
        return `<${button ? 'button type="button"' : "span"} class="dk-card ${c.red ? "dk-red" : ""}" ${attributes}><span>${esc(c.value)}${esc(c.suit)}</span><span class="dk-suit" aria-hidden="true">${esc(c.suit)}</span><span style="align-self:flex-end;font-size:14px">${esc(c.value)}</span></${button ? "button" : "span"}>`;
    }

    const motion = {
        capture: (root) => CardMotion.capture(root, "[data-motion-card]", "motionCard"),
        play(before, root, previous, current) {
            if (!previous || previous.revision === current.revision) return Promise.resolve();
            const boardBefore = (previous.board || [])
                    .flatMap((p) => [p.attack, p.defense])
                    .filter(Boolean),
                cleared = boardBefore.length && current.board.length === 0;
            const seatRect = (id) =>
                CardMotion.rect(root.querySelector(`[data-seat="${id}"] .dk-seat-backs`));
            return CardMotion.play(before, root, {
                selector: "[data-motion-card]",
                attribute: "motionCard",
                source: document.getElementById("durakDeck"),
                gap: 150,
                duration: 560,
                origin(key) {
                    if (
                        current.last_play &&
                        previous.last_play?.card !== current.last_play.card &&
                        current.last_play.card === key &&
                        current.last_play.player !== current.your_id
                    ) {
                        return (
                            [...before]
                                .reverse()
                                .find(([k]) =>
                                    k.startsWith(
                                        "back:" +
                                            previous.match_number +
                                            ":" +
                                            current.last_play.player +
                                            ":",
                                    ),
                                )?.[1].rect || seatRect(current.last_play.player)
                        );
                    }
                    if (
                        cleared &&
                        previous.taking &&
                        key.startsWith(
                            "back:" + current.match_number + ":" + previous.defender + ":",
                        )
                    ) {
                        const index = Number(key.split(":").at(-1)),
                            old =
                                previous.players.find((p) => p.id === previous.defender)?.count ||
                                0;
                        if (index >= old) return before.get(boardBefore[index - old]?.id)?.rect;
                    }
                },
                exit(key, item) {
                    if (key.startsWith("back:")) return null;
                    if (cleared)
                        return previous.taking
                            ? seatRect(previous.defender)
                            : CardMotion.rect(document.getElementById("durakDeck"));
                    return null;
                },
            });
        },
    };
    return {
        esc,
        money,
        defaults,
        api,
        form,
        read,
        summary,
        payouts,
        playingCard,
        motion,
    };
})();

</script>
