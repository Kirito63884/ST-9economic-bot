<style>

    --dm-line: #ffffff16;

  }
  .dm-page button,
  .dm-page input,
  .dm-page select {
    font: inherit;
  }

    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
  }

    color: #dbc18d;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-size: 10px;
    font-weight: 850;
  }
  .dm-head h1 {
    font-size: clamp(27px, 4vw, 40px);
    font-weight: 800;
    letter-spacing: -0.035em;
    margin: 7px 0;

  .dm-muted {
    color: var(--dm-muted);
    font-size: 13px;
    line-height: 1.75;
  }

    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .dm-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1px solid #ffffff25;
    border-radius: 11px;
    background: #ffffff06;
    color: #e0e8f5;
    padding: 11px 16px;
    text-decoration: none;
    font-size: 13px !important;
    font-weight: 750 !important;
    cursor: pointer;
    min-height: 44px;
  }
  .dm-btn:hover {
    color: white;
    background: #ffffff12;
  }
  .dm-btn.primary {
    color: #30281a;
    background: #e7c681;
    border-color: #e7c681;
  }
  .dm-btn.danger {
    color: #f4a0aa;
  }

  .dm-page select:focus-visible,
  .dm-page a:focus-visible {

    padding: 22px;

    font-weight: 800;
    margin: 0 0 18px;
  }
  .dm-panel p {
    margin: 12px 0 0;
  }
  .dm-panel summary {

    font-size: 14px;
    font-weight: 750;

    margin-bottom: 24px;

    letter-spacing: -0.035em;

    position: relative;
    z-index: 1;
  }
  .dm-hero p {
    max-width: 340px;
    color: #c6cfc8;
    font-size: 14px;
    line-height: 1.8;

    z-index: 1;
  }

    position: absolute;
    right: 35px;
    top: 35px;
    display: flex;
    gap: 12px;

    transform-origin: top right;
    opacity: 0.7;

    justify-content: space-between;

    padding: 20px;

    font-size: 17px;

    gap: 15px;

    color: #b5c1d3;
    font-size: 12px;

    border: 1px solid #ffffff25;
    background: #101b2a;
    color: #f3f5fb;

    display: flex;
    align-items: center;
    gap: 9px;

    border-radius: 17px;
    color: #a6b6ca;
    padding: 30px;
    text-align: center;
    font-size: 14px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin: 20px 0 13px;
  }
  .dm-row-head h2 {
    font-size: 18px;
    margin: 0;
    font-weight: 750;
  }

    color: #f5c498;

    margin-bottom: 16px;
    font-size: 13px;

    margin-bottom: 17px;

    padding: 14px;

    font-size: 13px;

    color: #a1b1c5;
    font-size: 10px;

    place-items: center;

    color: #e4e9d6;
  }

    height: 42px;

      #273e4a,
      #273e4a 3px,
      #2b4552 3px,
      #2b4552 6px

    border: 1px solid #ffffff28;
    border-radius: 6px;
    display: grid;
    place-items: center;
    color: #f0d9a9;
    font-size: 16px;
    font-weight: 800;
  }
  .dm-table {
    overflow: hidden;
    border: 1px solid #85765066;
    border-radius: 25px;
    background: radial-gradient(ellipse at 50% 30%, #285e55, #173e3e 80%);

      inset 0 0 0 8px #121e2380,
      inset 0 0 50px #0004;
    padding: 22px;
    position: relative;
    min-width: 0;
  }
  .dm-table-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin: 0 0 20px;
    padding: 0 3px;
    font-size: 12px;
    color: #bfd0bd;
  }
  .dm-table-top strong {
    color: #f6e2b6;
  }
  .dm-turn {
    color: #eddaa8;
    font-size: 14px;
    font-weight: 800;
  }
  .dm-clock {
    color: #f5dfb5;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .dm-clock.urgent {
    color: #ffaca6;
  }
  .dm-board {
    position: relative;
    min-height: 230px;
    display: grid;
    align-items: center;
    padding: 20px 5px;
  }
  .dm-drop-targets {
    position: absolute;
    inset: 0;
    display: flex;
    gap: 12px;
    padding: 8px;
    pointer-events: none;
  }
  .dm-drop-zone {
    flex: 1;
    min-width: 0;
    border: 2px dashed #f0d69b;
    border-radius: 16px;
    background: #102d38cc;
    color: #ffe7af;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 12px;
    font-size: 14px;
    font-weight: 750;
  }
  .dm-drop-zone.unavailable {
    border-color: #96a39b50;
    color: #bcc6c0;
    background: #192b2bd9;
  }
  .dm-drop-zone.over {
    border-style: solid;
    background: #d9bb74ee;
    color: #243428;
    box-shadow: inset 0 0 0 3px #fff4c366;
  }

    position: fixed;
    z-index: 10000;
    pointer-events: none;
    opacity: 0.9;
    margin: 0;
    will-change: left, top;
    transform: translate(-50%, -50%) rotate(-8deg);
  }

    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

    opacity: 0.3;
    cursor: grabbing;
  }

    width: 100%;
    max-width: 100%;
    padding: 12px 4px;
    overflow: hidden;
  }
  .dm-chain {
    position: relative;
    width: 100%;
    min-height: 90px;
  }
  .dm-placed {
    position: absolute;
    display: block;
    padding: 1px;
    transform-origin: center;
  }

  .dm-chain .dm-bone.double {
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    margin: 0;
  }
  .dm-chain .dm-half {
    padding: 10%;
  }
  .dm-direction {
    display: grid;
    gap: 4px;
    font-size: 12px;
    color: #dce6d6;
  }
  .dm-direction select {
    padding: 8px;
    border: 1px solid #75877e;
    border-radius: 8px;
    background: #142f32;
    color: #fff;
  }
  .dm-board-empty {
    text-align: center;
    color: #c6d6c4;
    max-width: 420px;
    margin: 0 auto;
    font-size: 14px;
    line-height: 1.8;
  }
  .dm-board-empty strong {
    display: block;
    font-size: 25px;
    color: #f0e4c5;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .dm-table-ends {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin: 0 5px 5px;
  }
  .dm-end {
    font-size: 11px;
    color: #b2c9ba;
  }
  .dm-end b {
    color: #f1deb2;
    font-size: 16px;
    margin: 0 5px;
  }
  .dm-controls {
    border-top: 1px solid #ffffff1a;
    margin-top: 14px;
    padding-top: 20px;
  }
  .dm-controls p {
    font-size: 12px;
    color: #c5d7c4;
    margin: 0 0 12px;
  }
  .dm-side-buttons {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
  }
  .dm-side-buttons .dm-btn {
    flex: 1;
    min-width: 135px;
    background: #f5e6c20c;
    border-color: #d1d9b338;
    color: #e8ead2;
  }
  .dm-side-buttons .dm-btn:not(:disabled):hover {
    background: #e7c681;
    color: #30281a;
  }
  .dm-hand-panel {
    margin-top: 18px;
    padding: 20px;
    border: 1px solid var(--dm-line);
    background: #192333;
    border-radius: 20px;
  }
  .dm-hand-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    margin-bottom: 17px;
  }
  .dm-hand-header h2 {
    font-size: 16px;
    margin: 0;
    font-weight: 800;
  }
  .dm-hand {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: start;
    min-height: 95px;
  }
  .dm-bone {
    width: 47px;
    height: 92px;
    display: flex;
    flex-direction: column;
    border: 1px solid #d2c8a2;
    border-radius: 8px;
    background: linear-gradient(120deg, #fff9df, #e5dec1);
    color: #233c40;
    box-shadow:
      0 5px 0 #958e77,
      0 8px 9px #0004;
    padding: 0;
    overflow: hidden;
    position: relative;
  }
  button.dm-bone {
    cursor: pointer;
    transition:
      transform 0.14s,
      box-shadow 0.14s;
    touch-action: manipulation;
  }
  button.dm-bone.legal {
    border-color: #f7d78a;
    box-shadow:
      0 5px 0 #b29964,
      0 0 0 2px #e7c68125,
      0 8px 12px #0003;
  }
  button.dm-bone.selected {
    transform: translateY(-7px);
    box-shadow:
      0 5px 0 #b29964,
      0 0 0 3px #e7c681,
      0 10px 18px #0005;
  }
  button.dm-bone:disabled {
    opacity: 0.47;
    cursor: default;
  }
  .dm-bone.horizontal {
    flex-direction: row;
  }
  .dm-half {
    flex: 1;
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    padding: 7px;
    min-height: 0;
    min-width: 0;
    position: relative;
    gap: 2px;
  }
  .dm-half + .dm-half {
    border-top: 1px solid #63634b65;
  }
  .horizontal .dm-half + .dm-half {
    border-top: 0;
    border-left: 1px solid #63634b65;
  }
  .dm-pip {
    background: #23413f;
    border-radius: 50%;
    aspect-ratio: 1;
    box-shadow: inset 0 1px 1px #0005;
  }
  .dm-bone.double {
    border-color: #c19c50;
  }
  .dm-lower {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
    margin-top: 18px;
  }
  .dm-log {
    max-height: 220px;
    overflow: auto;
    font-size: 12px;
    color: #aab9ca;
    margin-top: 15px;
  }
  .dm-log p {
    padding: 8px 0;
    margin: 0;
    border-bottom: 1px solid #ffffff10;
    overflow-wrap: anywhere;
  }
  .dm-log time {
    color: #788ea4;
    font-size: 10px;
    margin-right: 7px;
  }
  .dm-result {
    margin-top: 18px;
    border-color: #e7c68160;
  }
  .dm-result-row {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #ffffff12;
    font-size: 13px;
  }
  .dm-result-row strong {
    overflow-wrap: anywhere;
  }
  .dm-result-tiles {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin: 9px 0;
  }

    width: 30px;
    height: 58px;
    border-radius: 5px;
  }
  .dm-result-tiles .dm-half {
    padding: 4px;
    gap: 1px;
  }
  .dm-status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 18px 0;
  }
  .dm-connection {
    color: #8ea4b8;
    font-size: 11px;
  }
  .dm-connection::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #80c9aa;
    margin-right: 7px;
  }
  .dm-connection.offline::before {
    background: #efaf8f;
  }
  .dm-ready {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 18px;
  }
  .dm-rules ul {
    padding-left: 20px;
    margin: 15px 0 0;
  }
  .dm-rules li {
    margin: 8px 0;
  }
  @media (max-width: 850px) {

      grid-template-columns: 1fr;
    }
    .dm-lobby aside {
      grid-row: 1;
    }
    .dm-hero-art {
      right: 15px;
      opacity: 0.35;
    }
    .dm-hero {
      padding: 24px;
    }
    .dm-lower {
      grid-template-columns: 1fr;
    }
  }
  @media (max-width: 600px) {
    .dm-page {
      padding: 18px 10px 30px;
    }
    .dm-head {
      align-items: start;
    }
    .dm-head .dm-actions {
      justify-content: flex-end;
    }
    .dm-head .dm-btn {
      padding: 9px 11px;
      font-size: 11px !important;
    }
    .dm-seats {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .dm-seat {
      padding: 10px;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 7px;
    }
    .dm-avatar {
      display: none;
    }
    .dm-seat strong {
      font-size: 12px;
    }
    .dm-table {
      padding: 17px 12px;
      border-radius: 19px;
    }
    .dm-table-top {
      gap: 9px;
      flex-wrap: wrap;
    }
    .dm-board {
      min-height: 190px;
    }
    .dm-hand {
      gap: 10px;
    }
    .dm-hand-panel {
      padding: 17px 13px;
    }
    .dm-bone {
      width: 44px;
      height: 86px;
    }
    .dm-room {
      padding: 17px;
      flex-wrap: wrap;
    }
    .dm-panel {
      padding: 18px;
    }
    .dm-status {
      align-items: start;
    }
    .dm-status .dm-btn {
      padding: 9px;
      font-size: 11px !important;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    button.dm-bone {
      transition: none;
    }
  }
</style>
