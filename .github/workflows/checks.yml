name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python, shell and rendered JavaScript
        run: bash scripts/check.sh
      - name: Check expired confirmation in Moscow timezone
        env:
          TZ: Europe/Moscow
          PYTHON_DOTENV_DISABLED: '1'
        run: python -m pytest -q tests/test_bulk_security_freshness.py::test_confirmation_actor_expiry_and_permissions
